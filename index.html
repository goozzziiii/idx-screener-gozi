<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOZI TERMINAL | IDX Market & Technical Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #000000;
    --bg-panel: #0a0d12;
    --bg-sub: #11161f;
    --bg-hover: #1a2230;
    --border-main: #222936;
    --text-main: #e6edf3;
    --text-muted: #8b949e;
    --accent: #ff8000;
    --accent-hover: #e67300;
    --accent-soft: rgba(255, 128, 0, 0.15);
    --bull: #00c853;
    --bear: #ff3d00;
  }
  html.light {
    --bg-main: #f4f6f9;
    --bg-panel: #ffffff;
    --bg-sub: #edf1f5;
    --bg-hover: #e2e8f0;
    --border-main: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #475569;
    --accent: #d96b00;
    --accent-hover: #b85b00;
    --accent-soft: rgba(217, 107, 0, 0.12);
    --bull: #059669;
    --bear: #dc2626;
  }
  body {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background-color: var(--bg-main);
    color: var(--text-main);
    overflow: hidden;
    user-select: none;
  }
  .t-bg-main { background-color: var(--bg-main); }
  .t-bg-panel { background-color: var(--bg-panel); }
  .t-bg-sub { background-color: var(--bg-sub); }
  .t-border { border-color: var(--border-main); }
  .t-text-main { color: var(--text-main); }
  .t-text-muted { color: var(--text-muted); }
  .t-accent-bg { background-color: var(--accent); color: #000000; }
  .t-accent-text { color: var(--accent); }
  .t-row:hover { background-color: var(--bg-hover); }
  .t-row-active { background-color: var(--accent-soft); border-left: 2px solid var(--accent); }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 2px; }
  input, select {
    background-color: var(--bg-main);
    color: var(--text-main);
    border: 1px solid var(--border-main);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .tool-btn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; color: var(--text-muted); transition: all 0.12s;
  }
  .tool-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
  .tool-btn.active { background-color: var(--accent); color: #000000; }
</style>
</head>
<body class="h-screen flex flex-col">

<!-- TOP BLOOMBERG HEADER -->
<header class="h-10 t-bg-panel border-b t-border px-3 flex items-center justify-between shrink-0 gap-2 overflow-x-auto">
  <div class="flex items-center space-x-2.5 shrink-0">
    <div class="flex items-center space-x-2 pr-1">
      <span class="px-1.5 py-0.5 text-[10px] font-bold tracking-wider t-accent-bg rounded-xs">IDX</span>
      <span class="font-bold text-xs tracking-widest t-text-main uppercase">GOZI TERMINAL</span>
    </div>
    <span class="t-text-muted opacity-40">|</span>

    <!-- Ticker Search -->
    <div class="relative flex items-center">
      <svg class="w-3.5 h-3.5 t-text-muted absolute left-2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="top-ticker-input" value="BBCA" maxlength="6" class="w-24 font-bold text-xs uppercase pl-7 pr-2 py-1 rounded-xs tracking-wider" title="Ketik kode saham lalu Enter">
    </div>

    <!-- Timeframe -->
    <div class="flex items-center t-bg-main p-0.5 rounded-xs border t-border">
      <button onclick="selectTimeframe('1d')" id="btn-tf-1d" class="tf-btn px-2 py-0.5 text-[11px] font-bold rounded-xs t-accent-bg">1D</button>
      <button onclick="selectTimeframe('1w')" id="btn-tf-1w" class="tf-btn px-2 py-0.5 text-[11px] font-semibold rounded-xs t-text-muted">1W</button>
      <button onclick="selectTimeframe('1m')" id="btn-tf-1m" class="tf-btn px-2 py-0.5 text-[11px] font-semibold rounded-xs t-text-muted">1M</button>
    </div>

    <span class="t-text-muted opacity-40 hidden sm:inline">|</span>
    <div class="hidden sm:flex items-center space-x-1">
      <button onclick="zoomChart(85)" class="px-2 py-1 text-[11px] font-medium t-text-muted hover:opacity-100 rounded-xs t-row">Focus</button>
      <button onclick="fitAllChart()" class="px-2 py-1 text-[11px] font-medium t-text-muted hover:opacity-100 rounded-xs t-row">Fit All</button>
    </div>
  </div>

  <!-- Right Controls -->
  <div class="flex items-center space-x-2 shrink-0">
    <button onclick="toggleAppearanceModal()" class="px-2.5 py-1 text-[11px] font-medium rounded-xs border t-border t-bg-sub t-text-main t-row flex items-center space-x-1.5">
      <svg class="w-3.5 h-3.5 t-accent-text" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      <span>Style</span>
    </button>

    <button onclick="toggleTheme()" class="px-2.5 py-1 text-[11px] font-medium rounded-xs border t-border t-bg-sub t-text-main t-row flex items-center space-x-1.5">
      <svg class="w-3.5 h-3.5 t-accent-text" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2m-17.07 7.07 1.41-1.41m11.32-11.32 1.41-1.41"/></svg>
      <span id="theme-lbl">Light</span>
    </button>

    <button onclick="toggleScreenerDrawer()" class="px-3 py-1 text-[11px] font-bold rounded-xs t-accent-bg flex items-center space-x-1.5">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M7 12h10m-7 6h4"/></svg>
      <span>Screener</span>
      <span id="top-scr-count" class="px-1.5 py-0.2 rounded-xs bg-black/20 text-[10px] tabular-nums">0</span>
    </button>
  </div>
</header>

<!-- MAIN WORKSPACE -->
<div class="flex-1 flex relative overflow-hidden">

  <!-- LEFT DRAWING TOOLBAR (TRADINGVIEW STYLE) -->
  <aside class="w-10 t-bg-panel border-r t-border flex flex-col items-center py-2 space-y-1 shrink-0 z-20">
    <button onclick="setDrawTool('cursor')" id="tool-cursor" class="tool-btn active" title="Select / Crosshair (Esc)"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg></button>
    <button onclick="setDrawTool('trendline')" id="tool-trendline" class="tool-btn" title="Trendline"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.5 17.5 17.5 6.5"/></svg></button>
    <button onclick="setDrawTool('extline')" id="tool-extline" class="tool-btn" title="Extended Ray"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 21 21 3"/><circle cx="8" cy="16" r="1.5"/><circle cx="14" cy="10" r="1.5"/></svg></button>
    <button onclick="setDrawTool('hline')" id="tool-hline" class="tool-btn" title="Horizontal Line"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="2"/></svg></button>
    <button onclick="setDrawTool('vline')" id="tool-vline" class="tool-btn" title="Vertical Line"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 3v18"/><circle cx="12" cy="12" r="2"/></svg></button>
    <button onclick="setDrawTool('rect')" id="tool-rect" class="tool-btn" title="Zone / Rectangle"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button onclick="setDrawTool('fib')" id="tool-fib" class="tool-btn" title="Fibonacci Retracement"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 19h16"/></svg></button>
    <button onclick="setDrawTool('rr')" id="tool-rr" class="tool-btn" title="Long / Short Position Box"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 5h16v7H4z"/><path d="M4 12h16v7H4z" stroke-dasharray="2 2"/></svg></button>
    <button onclick="setDrawTool('text')" id="tool-text" class="tool-btn" title="Text Annotation"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></button>
    <div class="w-5 border-t t-border my-1"></div>
    <label class="tool-btn cursor-pointer" title="Default Stroke Color"><span id="draw-color-dot" class="w-3.5 h-3.5 rounded-full border border-white/40" style="background-color:#ff8000"></span><input type="color" id="draw-color-input" value="#ff8000" class="hidden" onchange="updateDefaultDrawColor(this.value)"></label>
    <button onclick="toggleHideDrawings()" id="tool-hide-draw" class="tool-btn" title="Hide/Show All Drawings"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button onclick="deleteSelectedDrawing()" id="tool-del-selected" class="tool-btn hidden text-red-500" title="Delete Selected Object (Del)"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <button onclick="clearAllDrawings()" class="tool-btn hover:text-red-500" title="Clear All Drawings"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
  </aside>

  <!-- CENTER CHART AREA -->
  <div id="chart-section" class="flex-1 flex flex-col relative overflow-hidden">
    <!-- Legend & Indicator Bar -->
    <div class="px-3 py-1.5 border-b t-border t-bg-main flex flex-wrap items-center justify-between gap-2 text-xs shrink-0">
      <div class="flex items-center space-x-2.5">
        <span id="chart-ticker-lbl" class="font-bold text-sm t-accent-text tracking-wider">BBCA</span>
        <span id="chart-tf-lbl" class="px-1.5 py-0.5 rounded-xs t-bg-sub text-[10px] font-bold t-text-muted">1D</span>
        <span id="chart-price-lbl" class="font-bold t-text-main tabular-nums">-</span>
        <span id="chart-chg-lbl" class="font-semibold tabular-nums">-</span>
        <span id="chart-crt-status" class="hidden px-2 py-0.5 rounded-xs text-[10px] font-bold tracking-wide">-</span>
        <div class="hidden xl:flex items-center space-x-2.5 text-[11px] t-text-muted pl-2 border-l t-border tabular-nums">
          <span>O <b id="leg-o" class="font-normal t-text-main">-</b></span>
          <span>H <b id="leg-h" class="font-normal t-text-main">-</b></span>
          <span>L <b id="leg-l" class="font-normal t-text-main">-</b></span>
          <span>C <b id="leg-c" class="font-normal t-text-main">-</b></span>
        </div>
      </div>

      <div class="flex items-center flex-wrap gap-1.5 text-[11px]">
        <div ondblclick="openIndModal('ma1')" class="flex items-center space-x-1 px-2 py-0.5 rounded-xs t-bg-panel border t-border cursor-pointer" title="Double-click to configure">
          <span id="dot-ma1" class="w-2 h-2 rounded-full" style="background-color:#ff8000"></span>
          <span id="lbl-ma1" class="font-medium t-text-main">SMA 20</span>
          <b id="val-ma1" class="font-normal t-text-muted tabular-nums">-</b>
          <button onclick="event.stopPropagation(); toggleInd('ma1')" class="ml-1 t-text-muted"><svg id="eye-ma1" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div ondblclick="openIndModal('ma2')" class="flex items-center space-x-1 px-2 py-0.5 rounded-xs t-bg-panel border t-border cursor-pointer" title="Double-click to configure">
          <span id="dot-ma2" class="w-2 h-2 rounded-full" style="background-color:#00b0ff"></span>
          <span id="lbl-ma2" class="font-medium t-text-main">SMA 50</span>
          <b id="val-ma2" class="font-normal t-text-muted tabular-nums">-</b>
          <button onclick="event.stopPropagation(); toggleInd('ma2')" class="ml-1 t-text-muted"><svg id="eye-ma2" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="flex items-center space-x-1 px-2 py-0.5 rounded-xs t-bg-panel border t-border">
          <span class="w-2 h-2 rounded-full bg-[#00c853]"></span>
          <span class="font-medium t-text-main">CRT</span>
          <button onclick="toggleInd('crt')" class="ml-1 t-text-muted"><svg id="eye-crt" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div ondblclick="openIndModal('rsi')" class="flex items-center space-x-1 px-2 py-0.5 rounded-xs t-bg-panel border t-border cursor-pointer" title="Double-click to configure">
          <span id="lbl-rsi" class="font-medium t-text-muted">RSI 14</span>
          <button onclick="event.stopPropagation(); toggleSubPane('rsi')" class="ml-1 t-text-muted"><svg id="eye-rsi" class="w-3 h-3 opacity-40" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div ondblclick="openIndModal('stoch')" class="flex items-center space-x-1 px-2 py-0.5 rounded-xs t-bg-panel border t-border cursor-pointer" title="Double-click to configure">
          <span id="lbl-stoch" class="font-medium t-text-muted">StochRSI 10,10,5,5</span>
          <button onclick="event.stopPropagation(); toggleSubPane('stoch')" class="ml-1 t-text-muted"><svg id="eye-stoch" class="w-3 h-3 opacity-40" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Draw Status Hint -->
    <div id="draw-hint-bar" class="hidden t-bg-sub border-b t-border px-3 py-1 text-[11px] t-accent-text flex items-center justify-between shrink-0">
      <span id="draw-hint-text">Klik titik pertama pada area chart...</span>
      <button onclick="setDrawTool('cursor')" class="text-[10px] underline">Batal (Esc)</button>
    </div>

    <!-- TRADINGVIEW FLOATING OBJECT TOOLBAR (APPEARS WHEN DRAWING SELECTED) -->
    <div id="floating-draw-toolbar" class="hidden absolute top-14 left-1/2 -translate-x-1/2 z-30 t-bg-panel border t-border rounded-xs shadow-2xl px-2.5 py-1.5 flex items-center space-x-2 text-[11px]">
      <span id="flt-obj-type" class="font-bold t-accent-text uppercase text-[10px] pr-1 border-r t-border">OBJECT</span>
      <label class="flex items-center space-x-1 cursor-pointer" title="Ubah Warna">
        <input type="color" id="sel-obj-color" onchange="updateSelectedObjProp('color', this.value)" class="w-5 h-5 border-0 p-0 bg-transparent cursor-pointer">
      </label>
      <select id="sel-obj-width" onchange="updateSelectedObjProp('width', parseFloat(this.value))" class="px-1.5 py-0.5 rounded-xs text-[10px]" title="Ketebalan Garis">
        <option value="1">1px</option>
        <option value="1.5">1.5px</option>
        <option value="2">2px</option>
        <option value="3">3px</option>
      </select>
      <select id="sel-obj-dash" onchange="updateSelectedObjProp('dash', this.value)" class="px-1.5 py-0.5 rounded-xs text-[10px]" title="Gaya Garis">
        <option value="">Solid</option>
        <option value="6 4">Dashed</option>
        <option value="2 3">Dotted</option>
      </select>
      <button id="sel-obj-edit-text" onclick="editSelectedObjText()" class="hidden px-2 py-0.5 rounded-xs t-bg-sub border t-border hover:opacity-80">Edit Teks</button>
      <button onclick="deleteSelectedDrawing()" class="px-2 py-0.5 rounded-xs bg-red-600/20 text-red-500 font-bold hover:bg-red-600/30" title="Hapus (Del)">Hapus</button>
      <button onclick="deselectDrawing()" class="t-text-muted hover:opacity-100 px-1">✕</button>
    </div>

    <!-- Main Chart + Interactive SVG Layer -->
    <div id="chart-wrapper" class="flex-1 w-full relative overflow-hidden">
      <div id="htf-chart-container" class="w-full h-full"></div>
      <svg id="drawing-svg" class="absolute inset-0 w-full h-full z-10"></svg>
    </div>

    <!-- RSI Pane -->
    <div id="pane-rsi-wrap" class="hidden h-28 border-t t-border relative t-bg-main shrink-0">
      <div ondblclick="openIndModal('rsi')" class="absolute top-1 left-3 z-10 text-[10px] font-bold t-text-muted cursor-pointer">RSI (<span id="pane-rsi-len">14</span>): <span id="pane-rsi-val" class="t-text-main tabular-nums">-</span></div>
      <div id="rsi-chart-container" class="w-full h-full"></div>
    </div>

    <!-- StochRSI Pane -->
    <div id="pane-stoch-wrap" class="hidden h-28 border-t t-border relative t-bg-main shrink-0">
      <div ondblclick="openIndModal('stoch')" class="absolute top-1 left-3 z-10 text-[10px] font-bold t-text-muted cursor-pointer">StochRSI (<span id="pane-stoch-params">10,10,5,5</span>): <span id="pane-stoch-val" class="t-text-main tabular-nums">-</span></div>
      <div id="stoch-chart-container" class="w-full h-full"></div>
    </div>
  </div>

  <!-- RIGHT SCREENER DRAWER (2 TABS + FULL SCREEN MODE) -->
  <aside id="screener-drawer" class="hidden w-full sm:w-[490px] t-bg-panel border-l t-border flex flex-col h-full z-30 shadow-2xl transition-all duration-150">
    <!-- Drawer Header -->
    <div class="px-3.5 py-2 border-b t-border flex items-center justify-between shrink-0">
      <div>
        <h2 class="text-xs font-bold t-accent-text uppercase tracking-wider">Screener</h2>
        <p id="last-updated" class="text-[10px] t-text-muted tabular-nums">Update: -</p>
      </div>
      <div class="flex items-center space-x-1.5">
        <button onclick="setScreenerTF('1d')" id="scr-tf-1d" class="px-2 py-0.5 text-[11px] font-bold rounded-xs t-accent-bg">1D</button>
        <button onclick="setScreenerTF('1w')" id="scr-tf-1w" class="px-2 py-0.5 text-[11px] font-semibold rounded-xs t-bg-sub t-text-muted">1W</button>
        <button onclick="setScreenerTF('1m')" id="scr-tf-1m" class="px-2 py-0.5 text-[11px] font-semibold rounded-xs t-bg-sub t-text-muted">1M</button>
        <span class="t-text-muted opacity-30">|</span>
        <button onclick="toggleScreenerFullscreen()" id="btn-scr-full" class="px-2 py-0.5 text-[10px] font-semibold rounded-xs border t-border t-bg-sub t-text-main t-row flex items-center space-x-1" title="Full Screen Tabel">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          <span id="lbl-scr-full">Full Screen</span>
        </button>
        <button onclick="toggleScreenerDrawer()" class="p-1 t-text-muted hover:opacity-100"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
    </div>

    <!-- ONLY 2 TABS: SEMUA SAHAM & SCREENER -->
    <div class="flex border-b t-border text-[11px] font-bold t-bg-sub shrink-0">
      <button onclick="switchScreenerTab('all')" id="tab-all" class="flex-1 py-2 text-center border-b-2" style="border-color:var(--accent); color:var(--accent)">
        Semua Saham (<span id="count-all" class="tabular-nums">0</span>)
      </button>

<script>
let screenerData = null, currentChartData = null, currentTicker = 'BBCA', activeChartTF = '1d', screenerTF = '1d';
let activeScreenerTab = 'all', isScreenerFullscreen = false, isDarkMode = true;
let mainChart, candleSeries, volumeSeries, ma1Series, ma2Series, rsiChart, rsiSeries, stochChart, stochKSeries, stochDSeries, crtPriceLines = [];

const defaultAppearance = {
  bodyUp: '#00c853', bodyDown: '#ff3d00', wickUp: '#00c853', wickDown: '#ff3d00',
  bdrUp: '#00c853', bdrDown: '#ff3d00', showBorder: true, crtConf: '#00c853', crtPot: '#ffab00'
};
let appearance = JSON.parse(localStorage.getItem('gozi_appearance_v1')) || { ...defaultAppearance };
let indConfig = JSON.parse(localStorage.getItem('gozi_ind_v1')) || {
  ma1: { visible: true, type: 'SMA', period: 20, color: '#ff8000', width: 1.5 },
  ma2: { visible: true, type: 'SMA', period: 50, color: '#00b0ff', width: 1.5 },
  crt: { visible: true },
  rsi: { visible: false, period: 14, color: '#d500f9' },
  stoch: { visible: false, rsiLen: 10, stochLen: 10, smoothK: 5, smoothD: 5, colorK: '#ff8000', colorD: '#00b0ff' }
};

// ==========================================
// 1. MATH ENGINES
// ==========================================
function calcMA(candles, type, period) {
  const res = [], k = 2 / (period + 1); let emaPrev = null;
  for (let i = 0; i < candles.length; i++) {
    const close = candles[i].close;
    if (type === 'SMA') {
      if (i >= period - 1) { let sum = 0; for (let j = 0; j < period; j++) sum += candles[i - j].close; res.push({ time: candles[i].time, value: Number((sum / period).toFixed(2)) }); }
    } else {
      if (i === period - 1) { let sum = 0; for (let j = 0; j < period; j++) sum += candles[i - j].close; emaPrev = sum / period; res.push({ time: candles[i].time, value: Number(emaPrev.toFixed(2)) }); }
      else if (i >= period && emaPrev !== null) { emaPrev = (close - emaPrev) * k + emaPrev; res.push({ time: candles[i].time, value: Number(emaPrev.toFixed(2)) }); }
    }
  }
  return res;
}

function calcRSIArray(candles, period) {
  const out = new Array(candles.length).fill(null);
  if (candles.length <= period) return out;
  let gSum = 0, lSum = 0;
  for (let i = 1; i <= period; i++) { const d = candles[i].close - candles[i-1].close; if (d >= 0) gSum += d; else lSum -= d; }
  let avgG = gSum / period, avgL = lSum / period;
  out[period] = avgL === 0 ? 100 : 100 - (100 / (1 + avgG / avgL));
  for (let i = period + 1; i < candles.length; i++) {
    const d = candles[i].close - candles[i-1].close;
    avgG = (avgG * (period - 1) + (d >= 0 ? d : 0)) / period;
    avgL = (avgL * (period - 1) + (d < 0 ? -d : 0)) / period;
    out[i] = avgL === 0 ? 100 : 100 - (100 / (1 + avgG / avgL));
  }
  return out;
}

function calcStochRSI(candles, rsiLen, stochLen, smoothK, smoothD) {
  const rsiArr = calcRSIArray(candles, rsiLen), raw = new Array(candles.length).fill(null);
  for (let i = rsiLen + stochLen - 1; i < candles.length; i++) {
    let minR = Infinity, maxR = -Infinity, ok = true;
    for (let j = 0; j < stochLen; j++) { const v = rsiArr[i-j]; if (v === null) { ok = false; break; } if (v < minR) minR = v; if (v > maxR) maxR = v; }
    if (ok && maxR !== minR) raw[i] = 100 * ((rsiArr[i] - minR) / (maxR - minR));
  }
  const kArr = new Array(candles.length).fill(null);
  for (let i = smoothK - 1; i < candles.length; i++) {
    let s = 0, ok = true; for (let j = 0; j < smoothK; j++) { if (raw[i-j] === null) { ok = false; break; } s += raw[i-j]; }
    if (ok) kArr[i] = s / smoothK;
  }
  const kSeries = [], dSeries = [];
  for (let i = 0; i < candles.length; i++) {
    if (kArr[i] !== null) kSeries.push({ time: candles[i].time, value: Number(kArr[i].toFixed(2)) });
    if (i >= smoothD - 1) {
      let s = 0, ok = true; for (let j = 0; j < smoothD; j++) { if (kArr[i-j] === null) { ok = false; break; } s += kArr[i-j]; }
      if (ok) dSeries.push({ time: candles[i].time, value: Number((s / smoothD).toFixed(2)) });
    }
  }
  return { kSeries, dSeries };
}

// ==========================================
// 2. CHART INITIALIZATION & THEME SYNC
// ==========================================
function getChartThemeOptions() {
  return {
    layout: {
      background: { type: 'solid', color: isDarkMode ? '#000000' : '#f4f6f9' },
      textColor: isDarkMode ? '#8b949e' : '#475569',
      fontFamily: "'JetBrains Mono', monospace"
    },
    grid: {
      vertLines: { color: isDarkMode ? '#11161f' : '#e2e8f0' },
      horzLines: { color: isDarkMode ? '#11161f' : '#e2e8f0' }
    },
    rightPriceScale: { borderColor: isDarkMode ? '#222936' : '#cbd5e1' },
    timeScale: { borderColor: isDarkMode ? '#222936' : '#cbd5e1' }
  };
}

function initCharts() {
  const c = document.getElementById('htf-chart-container');
  const opts = getChartThemeOptions();
  mainChart = LightweightCharts.createChart(c, {
    ...opts,
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { ...opts.rightPriceScale, autoScale: true, scaleMargins: { top: 0.08, bottom: 0.18 } },
    timeScale: { ...opts.timeScale, timeVisible: true, rightOffset: 6 }
  });
  candleSeries = mainChart.addCandlestickSeries({
    upColor: appearance.bodyUp, downColor: appearance.bodyDown,
    wickUpColor: appearance.wickUp, wickDownColor: appearance.wickDown,
    borderVisible: appearance.showBorder, borderUpColor: appearance.bdrUp, borderDownColor: appearance.bdrDown
  });
  volumeSeries = mainChart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
  volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
  ma1Series = mainChart.addLineSeries({ color: indConfig.ma1.color, lineWidth: indConfig.ma1.width, visible: indConfig.ma1.visible, priceLineVisible: false });
  ma2Series = mainChart.addLineSeries({ color: indConfig.ma2.color, lineWidth: indConfig.ma2.width, visible: indConfig.ma2.visible, priceLineVisible: false });

  rsiChart = LightweightCharts.createChart(document.getElementById('rsi-chart-container'), { ...opts, timeScale: { visible: false } });
  rsiSeries = rsiChart.addLineSeries({ color: indConfig.rsi.color, lineWidth: 1.5, priceLineVisible: false });
  rsiSeries.createPriceLine({ price: 70, color: '#ff3d0066', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
  rsiSeries.createPriceLine({ price: 30, color: '#00c85366', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

  stochChart = LightweightCharts.createChart(document.getElementById('stoch-chart-container'), { ...opts, timeScale: { visible: false } });
  stochKSeries = stochChart.addLineSeries({ color: indConfig.stoch.colorK, lineWidth: 1.5, priceLineVisible: false });
  stochDSeries = stochChart.addLineSeries({ color: indConfig.stoch.colorD, lineWidth: 1.5, priceLineVisible: false });
  stochKSeries.createPriceLine({ price: 80, color: '#ff3d0066', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
  stochKSeries.createPriceLine({ price: 20, color: '#00c85366', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

  mainChart.timeScale().subscribeVisibleLogicalRangeChange((r) => {
    if (!r) return;
    if (indConfig.rsi.visible) rsiChart.timeScale().setVisibleLogicalRange(r);
    if (indConfig.stoch.visible) stochChart.timeScale().setVisibleLogicalRange(r);
    renderDrawings();
  });

  mainChart.subscribeCrosshairMove((p) => {
    if (!p.time || !p.seriesData) return;
    const bar = p.seriesData.get(candleSeries), m1 = p.seriesData.get(ma1Series), m2 = p.seriesData.get(ma2Series);
    if (bar) {
      document.getElementById('leg-o').textContent = bar.open.toLocaleString('id-ID');
      document.getElementById('leg-h').textContent = bar.high.toLocaleString('id-ID');
      document.getElementById('leg-l').textContent = bar.low.toLocaleString('id-ID');
      document.getElementById('leg-c').textContent = bar.close.toLocaleString('id-ID');
    }
    if (m1) document.getElementById('val-ma1').textContent = m1.value.toLocaleString('id-ID');
    if (m2) document.getElementById('val-ma2').textContent = m2.value.toLocaleString('id-ID');
  });

  window.addEventListener('resize', resizeAllCharts);
  syncAppearanceInputs();
  syncIndicatorPills();
}

function toggleTheme() {
  isDarkMode = !isDarkMode;
  document.documentElement.classList.toggle('light', !isDarkMode);
  document.documentElement.classList.toggle('dark', isDarkMode);
  document.getElementById('theme-lbl').textContent = isDarkMode ? 'Light' : 'Dark';

  const opts = getChartThemeOptions();
  mainChart.applyOptions(opts);
  rsiChart.applyOptions(opts);
  stochChart.applyOptions(opts);
  renderStockList();
}

function resizeAllCharts() {
  if (isScreenerFullscreen) return;
  const c = document.getElementById('htf-chart-container');
  mainChart.applyOptions({ width: c.clientWidth, height: c.clientHeight });
  if (indConfig.rsi.visible) { const r = document.getElementById('rsi-chart-container'); rsiChart.applyOptions({ width: r.clientWidth, height: r.clientHeight }); }
  if (indConfig.stoch.visible) { const s = document.getElementById('stoch-chart-container'); stochChart.applyOptions({ width: s.clientWidth, height: s.clientHeight }); }
  renderDrawings();
}

function zoomChart(bars = 85) {
  const total = candleSeries.data().length;
  mainChart.priceScale('right').applyOptions({ autoScale: true });
  if (total > 0) {
    const r = { from: Math.max(0, total - bars), to: total + 4 };
    mainChart.timeScale().setVisibleLogicalRange(r);
    if (indConfig.rsi.visible) rsiChart.timeScale().setVisibleLogicalRange(r);
    if (indConfig.stoch.visible) stochChart.timeScale().setVisibleLogicalRange(r);
  }
  setTimeout(renderDrawings, 30);
}

function fitAllChart() {
  mainChart.priceScale('right').applyOptions({ autoScale: true });
  mainChart.timeScale().fitContent();
  setTimeout(renderDrawings, 30);
}

// ==========================================
// 3. LOAD CHART DATA & INDICATORS
// ==========================================
async function loadHTFChart(ticker, tf) {
  currentTicker = ticker.toUpperCase();
  deselectDrawing();
  document.getElementById('top-ticker-input').value = currentTicker;
  document.getElementById('chart-ticker-lbl').textContent = currentTicker;
  document.getElementById('chart-tf-lbl').textContent = tf.toUpperCase();

  const summary = screenerData?.[tf]?.all_data?.[currentTicker];
  if (summary) {
    document.getElementById('chart-price-lbl').textContent = 'Rp ' + summary.close.toLocaleString('id-ID');
    const chgEl = document.getElementById('chart-chg-lbl');
    chgEl.textContent = `${summary.change_pct > 0 ? '+' : ''}${summary.change_pct}%`;
    chgEl.style.color = summary.change_pct >= 0 ? 'var(--bull)' : 'var(--bear)';
  }

  try {
    const res = await fetch(`data/charts/${currentTicker}.json`);
    const fullJson = await res.json();
    const data = fullJson[tf];
    if (!data?.candles) return;
    currentChartData = data;
    candleSeries.setData(data.candles);
    volumeSeries.setData(data.volume.map(v => ({ time: v.time, value: v.value, color: v.isUp ? appearance.bodyUp + '55' : appearance.bodyDown + '55' })));
    recomputeIndicators();
    zoomChart(tf === '1m' ? 48 : (tf === '1w' ? 75 : 85));
  } catch (err) { console.error(err); }
}

function recomputeIndicators() {
  if (!currentChartData?.candles) return;
  const candles = currentChartData.candles;
  const m1 = calcMA(candles, indConfig.ma1.type, indConfig.ma1.period);
  const m2 = calcMA(candles, indConfig.ma2.type, indConfig.ma2.period);
  ma1Series.setData(m1); ma2Series.setData(m2);
  if (m1.length) document.getElementById('val-ma1').textContent = m1[m1.length-1].value.toLocaleString('id-ID');
  if (m2.length) document.getElementById('val-ma2').textContent = m2[m2.length-1].value.toLocaleString('id-ID');

  const rsiRaw = calcRSIArray(candles, indConfig.rsi.period), rsiData = [];
  for (let i = 0; i < candles.length; i++) if (rsiRaw[i] !== null) rsiData.push({ time: candles[i].time, value: Number(rsiRaw[i].toFixed(2)) });
  rsiSeries.setData(rsiData);
  if (rsiData.length) document.getElementById('pane-rsi-val').textContent = rsiData[rsiData.length-1].value;

  const { kSeries, dSeries } = calcStochRSI(candles, indConfig.stoch.rsiLen, indConfig.stoch.stochLen, indConfig.stoch.smoothK, indConfig.stoch.smoothD);
  stochKSeries.setData(kSeries); stochDSeries.setData(dSeries);
  if (kSeries.length && dSeries.length) document.getElementById('pane-stoch-val').textContent = `K ${kSeries[kSeries.length-1].value} / D ${dSeries[dSeries.length-1].value}`;

  crtPriceLines.forEach(l => candleSeries.removePriceLine(l)); crtPriceLines = []; candleSeries.setMarkers([]);
  const badge = document.getElementById('chart-crt-status'); badge.classList.add('hidden');

  if (indConfig.crt.visible && currentChartData.crt) {
    if (currentChartData.crt.markers?.length) {
      candleSeries.setMarkers(currentChartData.crt.markers.map(m => ({
        ...m, color: m.text.includes('POTENTIAL') ? appearance.crtPot : (m.position === 'belowBar' ? appearance.crtConf : '#ff3d00')
      })));
    }
    const s = currentChartData.crt.latest_setup;
    if (s && !s.is_broken) {
      const isPot = s.status === 'POTENTIAL', col = isPot ? appearance.crtPot : (s.dir === 1 ? appearance.crtConf : '#ff3d00');
      badge.textContent = `${s.signal} [${s.status}]`;
      badge.className = 'px-2 py-0.5 rounded-xs text-[10px] font-bold tracking-wide';
      badge.style.backgroundColor = col + '26';
      badge.style.color = col;
      crtPriceLines.push(candleSeries.createPriceLine({ price: s.crth, color: col, lineWidth: 2, lineStyle: isPot ? 2 : 0, axisLabelVisible: true, title: 'CRTH' }));
      crtPriceLines.push(candleSeries.createPriceLine({ price: s.mid50, color: col, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '50%' }));
      crtPriceLines.push(candleSeries.createPriceLine({ price: s.crtl, color: col, lineWidth: 2, lineStyle: isPot ? 2 : 0, axisLabelVisible: true, title: 'CRTL' }));
    }
  }
  if (candles.length) {
    const last = candles[candles.length-1];
    document.getElementById('leg-o').textContent = last.open.toLocaleString('id-ID');

    document.getElementById('leg-l').textContent = last.low.toLocaleString('id-ID');
    document.getElementById('leg-c').textContent = last.close.toLocaleString('id-ID');
  }
}

// 5. TRADINGVIEW INTERACTIVE DRAWING ENGINE
//    (SELECT, MOVE, RESIZE HANDLES, EDIT)
// ==========================================
let activeDrawTool = 'cursor', defaultDrawColor = '#ff8000', hideAllDrawings = false;
let pendingPoint = null, selectedDrawId = null, dragState = null;

function getDrawStorageKey() { return `gozi_drawings_${currentTicker}_${activeChartTF}`; }
function loadDrawingsList() { return JSON.parse(localStorage.getItem(getDrawStorageKey())) || []; }
function saveDrawingsList(l) { localStorage.setItem(getDrawStorageKey(), JSON.stringify(l)); }

function setDrawTool(t) {
  activeDrawTool = t;
  pendingPoint = null;
  if (t !== 'cursor') deselectDrawing();

  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tool-${t}`)?.classList.add('active');

  const svg = document.getElementById('drawing-svg'), hint = document.getElementById('draw-hint-bar');
  if (t === 'cursor') {
    svg.style.cursor = 'default';
    hint.classList.add('hidden');
  } else {
    svg.style.cursor = 'crosshair';
    hint.classList.remove('hidden');
    document.getElementById('draw-hint-text').textContent = ['hline', 'vline', 'text'].includes(t)
      ? 'Klik 1 titik pada chart untuk menempatkan objek.'
      : 'Klik titik awal, lalu klik titik akhir pada chart.';
  }
  renderDrawings();
}

function updateDefaultDrawColor(hex) {
  defaultDrawColor = hex;
  document.getElementById('draw-color-dot').style.backgroundColor = hex;
}

function toggleHideDrawings() {
  hideAllDrawings = !hideAllDrawings;
  document.getElementById('tool-hide-draw').style.opacity = hideAllDrawings ? '0.4' : '1';
  if (hideAllDrawings) deselectDrawing();
  renderDrawings();
}

function selectDrawing(id) {
  selectedDrawId = id;
  const list = loadDrawingsList();
  const obj = list.find(x => x.id === id);
  const bar = document.getElementById('floating-draw-toolbar');
  const delBtn = document.getElementById('tool-del-selected');
  if (!obj) { deselectDrawing(); return; }

  bar.classList.remove('hidden');
  delBtn.classList.remove('hidden');
  document.getElementById('flt-obj-type').textContent = obj.type.toUpperCase();
  document.getElementById('sel-obj-color').value = obj.color || '#ff8000';
  document.getElementById('sel-obj-width').value = String(obj.width || 1.5);
  document.getElementById('sel-obj-dash').value = obj.dash || '';
  document.getElementById('sel-obj-edit-text').classList.toggle('hidden', obj.type !== 'text');
  renderDrawings();
}

function deselectDrawing() {
  selectedDrawId = null;
  document.getElementById('floating-draw-toolbar').classList.add('hidden');
  document.getElementById('tool-del-selected').classList.add('hidden');
  renderDrawings();
}

function updateSelectedObjProp(prop, val) {
  if (!selectedDrawId) return;
  const list = loadDrawingsList();
  const idx = list.findIndex(x => x.id === selectedDrawId);
  if (idx !== -1) {
    list[idx][prop] = val;
    saveDrawingsList(list);
    renderDrawings();
  }
}

function editSelectedObjText() {
  if (!selectedDrawId) return;
  const list = loadDrawingsList();
  const idx = list.findIndex(x => x.id === selectedDrawId);
  if (idx !== -1 && list[idx].type === 'text') {
    const newTxt = prompt('Edit teks catatan:', list[idx].text);
    if (newTxt !== null && newTxt.trim() !== '') {
      list[idx].text = newTxt.trim();
      saveDrawingsList(list);
      renderDrawings();
    }
  }
}

function deleteSelectedDrawing() {
  if (!selectedDrawId) return;
  const list = loadDrawingsList().filter(x => x.id !== selectedDrawId);
  saveDrawingsList(list);
  deselectDrawing();
}

function clearAllDrawings() {
  saveDrawingsList([]);
  deselectDrawing();
}

function pixelToChartCoord(x, y) {
  if (!currentChartData?.candles?.length) return null;
  const logical = mainChart.timeScale().coordinateToLogical(x);
  const price = candleSeries.coordinateToPrice(y);
  if (logical === null || price === null) return null;
  const idx = Math.max(0, Math.min(currentChartData.candles.length - 1, Math.round(logical)));
  return { idx, time: currentChartData.candles[idx].time, price: Number(price.toFixed(2)) };
}

function chartCoordToPixel(pt) {
  if (!currentChartData?.candles?.length || !pt) return null;
  let idx = currentChartData.candles.findIndex(c => c.time === pt.time);
  if (idx === -1) idx = pt.idx || 0;
  const x = mainChart.timeScale().logicalToCoordinate(idx);
  const y = candleSeries.priceToCoordinate(pt.price);
  return (x === null || y === null) ? null : { x, y };
}

const svgCanvas = document.getElementById('drawing-svg');

// Allow chart pan/zoom when in cursor mode unless clicking on a drawing object
svgCanvas.style.pointerEvents = 'none';

function handleObjPointerDown(e, id, mode) {
  e.stopPropagation();
  if (activeDrawTool !== 'cursor') return;
  selectDrawing(id);
  const rect = svgCanvas.getBoundingClientRect();
  const list = loadDrawingsList();
  const obj = list.find(x => x.id === id);
  if (!obj) return;

  dragState = {
    id,
    mode, // 'move', 'p1', 'p2'
    startX: e.clientX - rect.left,
    startY: e.clientY - rect.top,
    origP1: { ...obj.p1 },
    origP2: obj.p2 ? { ...obj.p2 } : null
  };
  svgCanvas.style.pointerEvents = 'auto';
}

window.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  const rect = svgCanvas.getBoundingClientRect();
  const curX = e.clientX - rect.left;
  const curY = e.clientY - rect.top;
  const list = loadDrawingsList();
  const idx = list.findIndex(x => x.id === dragState.id);
  if (idx === -1) return;

  if (dragState.mode === 'p1') {
    const pt = pixelToChartCoord(curX, curY);
    if (pt) list[idx].p1 = pt;
  } else if (dragState.mode === 'p2') {
    const pt = pixelToChartCoord(curX, curY);
    if (pt) list[idx].p2 = pt;
  } else if (dragState.mode === 'move') {
    const startPt = pixelToChartCoord(dragState.startX, dragState.startY);
    const curPt = pixelToChartCoord(curX, curY);
    if (startPt && curPt) {
      const dIdx = curPt.idx - startPt.idx;
      const dPrice = curPt.price - startPt.price;
      const maxIdx = currentChartData.candles.length - 1;

      const newIdx1 = Math.max(0, Math.min(maxIdx, dragState.origP1.idx + dIdx));
      list[idx].p1 = {
        idx: newIdx1,
        time: currentChartData.candles[newIdx1].time,
        price: Number((dragState.origP1.price + dPrice).toFixed(2))
      };

      if (dragState.origP2) {
        const newIdx2 = Math.max(0, Math.min(maxIdx, dragState.origP2.idx + dIdx));
        list[idx].p2 = {
          idx: newIdx2,
          time: currentChartData.candles[newIdx2].time,
          price: Number((dragState.origP2.price + dPrice).toFixed(2))
        };
      }
    }
  }
  saveDrawingsList(list);
  renderDrawings();
});

window.addEventListener('pointerup', () => {
  if (dragState) {
    dragState = null;
    if (activeDrawTool === 'cursor') svgCanvas.style.pointerEvents = 'none';
  }
});

// Drawing creation click handler
svgCanvas.addEventListener('click', (e) => {
  if (activeDrawTool === 'cursor') return;
  const rect = svgCanvas.getBoundingClientRect();
  const pt = pixelToChartCoord(e.clientX - rect.left, e.clientY - rect.top);
  if (!pt) return;

  const list = loadDrawingsList();
  const newId = 'obj_' + Date.now();

  if (activeDrawTool === 'hline' || activeDrawTool === 'vline') {
    list.push({ id: newId, type: activeDrawTool, p1: pt, color: defaultDrawColor, width: 1.5, dash: '5 3' });
    saveDrawingsList(list);
    setDrawTool('cursor');
    selectDrawing(newId);
    return;
  }
  if (activeDrawTool === 'text') {
    const txt = prompt('Masukkan catatan chart:');
    if (txt && txt.trim()) {
      list.push({ id: newId, type: 'text', p1: pt, text: txt.trim(), color: defaultDrawColor, width: 1.5, dash: '' });
      saveDrawingsList(list);
      setDrawTool('cursor');
      selectDrawing(newId);
    } else {
      setDrawTool('cursor');
    }
    return;
  }

  if (!pendingPoint) {
    pendingPoint = pt;
    document.getElementById('draw-hint-text').textContent = 'Klik titik kedua untuk menyelesaikan gambar...';
  } else {
    list.push({ id: newId, type: activeDrawTool, p1: pendingPoint, p2: pt, color: defaultDrawColor, width: 1.8, dash: '' });
    saveDrawingsList(list);
    pendingPoint = null;
    setDrawTool('cursor');
    selectDrawing(newId);
  }
});

// Toggle SVG pointer capture only when drawing tool is active
const origSetDrawTool = setDrawTool;
setDrawTool = function(t) {
  origSetDrawTool(t);
  svgCanvas.style.pointerEvents = (t === 'cursor') ? 'none' : 'auto';
};

// Deselect when clicking empty chart space in cursor mode
document.getElementById('htf-chart-container').addEventListener('click', () => {
  if (activeDrawTool === 'cursor' && selectedDrawId) deselectDrawing();
});

function renderDrawings() {
  svgCanvas.innerHTML = '';
  if (hideAllDrawings) return;
  const list = loadDrawingsList(), w = svgCanvas.clientWidth, h = svgCanvas.clientHeight;

  list.forEach(item => {
    const a = chartCoordToPixel(item.p1);
    if (!a) return;
    const col = item.color || '#ff8000';
    const sw = item.width || 1.5;
    const dash = item.dash || '';
    const isSel = item.id === selectedDrawId;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.pointerEvents = 'all';
    g.style.cursor = 'move';
    g.addEventListener('pointerdown', (e) => handleObjPointerDown(e, item.id, 'move'));

    if (item.type === 'hline') {
      g.innerHTML = `
        <line x1="0" y1="${a.y}" x2="${w}" y2="${a.y}" stroke="transparent" stroke-width="14"/>
        <line x1="0" y1="${a.y}" x2="${w}" y2="${a.y}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${dash}"/>
        <text x="${w - 72}" y="${a.y - 5}" fill="${col}" font-size="10" font-weight="700">${item.p1.price}</text>
      `;
      if (isSel) g.innerHTML += `<circle cx="${w / 2}" cy="${a.y}" r="5" fill="#ffffff" stroke="#ff8000" stroke-width="2"/>`;
    } else if (item.type === 'vline') {
      g.innerHTML = `
        <line x1="${a.x}" y1="0" x2="${a.x}" y2="${h}" stroke="transparent" stroke-width="14"/>
        <line x1="${a.x}" y1="0" x2="${a.x}" y2="${h}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${dash}"/>
      `;
      if (isSel) g.innerHTML += `<circle cx="${a.x}" cy="${h / 2}" r="5" fill="#ffffff" stroke="#ff8000" stroke-width="2"/>`;
    } else if (item.type === 'text') {
      g.innerHTML = `
        <rect x="${a.x - 4}" y="${a.y - 13}" width="${item.text.length * 7.2 + 8}" height="18" fill="${isSel ? 'rgba(255,128,0,0.18)' : 'transparent'}" stroke="${isSel ? '#ff8000' : 'none'}" rx="2"/>
        <text x="${a.x}" y="${a.y}" fill="${col}" font-size="11" font-weight="700">${item.text}</text>
      `;
    } else if (item.p2) {
      const b = chartCoordToPixel(item.p2);
      if (!b) return;

      if (item.type === 'trendline') {
        g.innerHTML = `
          <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="14"/>
          <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${dash}"/>
        `;
      } else if (item.type === 'extline') {
        const dx = b.x - a.x, dy = b.y - a.y, sc = dx !== 0 ? (w - a.x) / dx : 1;
        g.innerHTML = `
          <line x1="${a.x}" y1="${a.y}" x2="${w}" y2="${a.y + dy * sc}" stroke="transparent" stroke-width="14"/>
          <line x1="${a.x}" y1="${a.y}" x2="${w}" y2="${a.y + dy * sc}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${dash}"/>
        `;
      } else if (item.type === 'rect') {
        const rx = Math.min(a.x, b.x), ry = Math.min(a.y, b.y), rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
        g.innerHTML = `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${col}28" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${dash}"/>`;
      } else if (item.type === 'fib') {
        const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x, a.x + 120);
        let fibHtml = `<rect x="${x1}" y="${Math.min(a.y, b.y)}" width="${x2 - x1}" height="${Math.abs(b.y - a.y)}" fill="transparent"/>`;
        [0, 0.236, 0.382, 0.5, 0.618, 0.705, 0.786, 1].forEach(lvl => {
          const yL = a.y + (b.y - a.y) * lvl;
          const pV = (item.p1.price + (item.p2.price - item.p1.price) * lvl).toFixed(0);
          fibHtml += `<line x1="${x1}" y1="${yL}" x2="${x2}" y2="${yL}" stroke="${col}" stroke-width="1" stroke-opacity="0.85"/><text x="${x1 + 4}" y="${yL - 2}" fill="${col}" font-size="9" font-weight="600">${lvl} (${pV})</text>`;
        });
        g.innerHTML = fibHtml;
      } else if (item.type === 'rr') {
        const x1 = Math.min(a.x, b.x), rw = Math.max(60, Math.abs(b.x - a.x)), midY = (a.y + b.y) / 2;
        g.innerHTML = `
          <rect x="${x1}" y="${Math.min(a.y, b.y)}" width="${rw}" height="${Math.abs(midY - Math.min(a.y, b.y))}" fill="#00c85330" stroke="#00c853" stroke-width="1.2"/>
          <rect x="${x1}" y="${midY}" width="${rw}" height="${Math.abs(Math.max(a.y, b.y) - midY)}" fill="#ff3d0030" stroke="#ff3d00" stroke-width="1.2"/>
        `;
      }

      // Render TradingView Anchor Handles when selected
      if (isSel) {
        const h1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        h1.setAttribute('cx', a.x); h1.setAttribute('cy', a.y); h1.setAttribute('r', '5.5');
        h1.setAttribute('fill', '#ffffff'); h1.setAttribute('stroke', '#ff8000'); h1.setAttribute('stroke-width', '2');
        h1.style.cursor = 'nwse-resize';
        h1.addEventListener('pointerdown', (e) => handleObjPointerDown(e, item.id, 'p1'));

        const h2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        h2.setAttribute('cx', b.x); h2.setAttribute('cy', b.y); h2.setAttribute('r', '5.5');
        h2.setAttribute('fill', '#ffffff'); h2.setAttribute('stroke', '#ff8000'); h2.setAttribute('stroke-width', '2');
        h2.style.cursor = 'nwse-resize';
        h2.addEventListener('pointerdown', (e) => handleObjPointerDown(e, item.id, 'p2'));

        g.appendChild(h1);
        g.appendChild(h2);
      }
    }

    svgCanvas.appendChild(g);
  });
}

function toggleScreenerDrawer() {
  const drawer = document.getElementById('screener-drawer');
  drawer.classList.toggle('hidden');
  if (drawer.classList.contains('hidden') && isScreenerFullscreen) {
    isScreenerFullscreen = false;
    applyScreenerLayout();
  }
  setTimeout(() => { resizeAllCharts(); zoomChart(85); }, 40);
}

function toggleScreenerFullscreen() {
  isScreenerFullscreen = !isScreenerFullscreen;
  applyScreenerLayout();
}

function applyScreenerLayout() {
  const drawer = document.getElementById('screener-drawer');
  const chartSec = document.getElementById('chart-section');
  const lbl = document.getElementById('lbl-scr-full');

  if (isScreenerFullscreen) {
    chartSec.classList.add('hidden');
    drawer.classList.remove('sm:w-[490px]', 'border-l');
    drawer.classList.add('w-full');
    lbl.textContent = 'Exit Full';
  } else {
    chartSec.classList.remove('hidden');
    drawer.classList.remove('w-full');
    drawer.classList.add('w-full', 'sm:w-[490px]', 'border-l');
    lbl.textContent = 'Full Screen';
    setTimeout(() => { resizeAllCharts(); zoomChart(85); }, 40);
  }
  renderStockList();
}

function switchScreenerTab(tab) {
  activeScreenerTab = tab;
  const tabAll = document.getElementById('tab-all');
  const tabScr = document.getElementById('tab-screener');
  const panelAll = document.getElementById('panel-all-search');
  const panelScr = document.getElementById('panel-screener-filters');

  if (tab === 'all') {
    tabAll.style.borderColor = 'var(--accent)'; tabAll.style.color = 'var(--accent)';
    tabScr.style.borderColor = 'transparent'; tabScr.style.color = 'var(--text-muted)';
    panelAll.classList.remove('hidden');
    panelScr.classList.add('hidden');
  } else {
    tabScr.style.borderColor = 'var(--accent)'; tabScr.style.color = 'var(--accent)';
    tabAll.style.borderColor = 'transparent'; tabAll.style.color = 'var(--text-muted)';
    panelScr.classList.remove('hidden');
    panelAll.classList.add('hidden');
  }
  renderStockList();
}

function selectTimeframe(tf) {
  activeChartTF = tf;
  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.remove('t-accent-bg', 'font-bold');
    b.classList.add('t-text-muted', 'font-semibold');
  });
  const b = document.getElementById(`btn-tf-${tf}`);
  if (b) { b.classList.remove('t-text-muted', 'font-semibold'); b.classList.add('t-accent-bg', 'font-bold'); }
  loadHTFChart(currentTicker, tf);
}

function setScreenerTF(tf) {
  screenerTF = tf;
  ['1d', '1w', '1m'].forEach(t => {
    const btn = document.getElementById(`scr-tf-${t}`);
    if (t === tf) {
      btn.className = 'px-2 py-0.5 text-[11px] font-bold rounded-xs t-accent-bg';
    } else {
      btn.className = 'px-2 py-0.5 text-[11px] font-semibold rounded-xs t-bg-sub t-text-muted';
    }
  });
  renderStockList();
}

function resetFilters() {
  ['flt-ticker', 'flt-min-price', 'flt-max-price', 'flt-min-tx'].forEach(id => document.getElementById(id).value = '');
  ['flt-crt', 'flt-ma', 'flt-stoch', 'flt-rsi'].forEach(id => document.getElementById(id).value = 'ALL');
  document.getElementById('flt-sort').value = 'TICKER_ASC';
  renderStockList();
}

function renderStockList() {
  if (!screenerData?.[screenerTF]) return;
  const rawAll = Object.values(screenerData[screenerTF].all_data || {});
  document.getElementById('count-all').textContent = rawAll.length;

  let list = [...rawAll];

  if (activeScreenerTab === 'all') {
    const q = document.getElementById('all-quick-search').value.trim().toUpperCase();
    const s = document.getElementById('all-sort').value;
    if (q) list = list.filter(x => x.ticker.includes(q));
    if (s === 'TICKER_ASC') list.sort((a, b) => a.ticker.localeCompare(b.ticker));
    else if (s === 'TX_DESC') list.sort((a, b) => (b.tx_miliar || 0) - (a.tx_miliar || 0));
    else if (s === 'CHG_DESC') list.sort((a, b) => b.change_pct - a.change_pct);
    else if (s === 'PRICE_ASC') list.sort((a, b) => a.close - b.close);
    else if (s === 'PRICE_DESC') list.sort((a, b) => b.close - a.close);
    document.getElementById('top-scr-count').textContent = list.length;
  } else {
    const q = document.getElementById('flt-ticker').value.trim().toUpperCase();
    const minP = parseFloat(document.getElementById('flt-min-price').value);
    const maxP = parseFloat(document.getElementById('flt-max-price').value);
    const minTx = parseFloat(document.getElementById('flt-min-tx').value);
    const fCrt = document.getElementById('flt-crt').value;
    const fMa = document.getElementById('flt-ma').value;
    const fSt = document.getElementById('flt-stoch').value;
    const fRsi = document.getElementById('flt-rsi').value;
    const fSort = document.getElementById('flt-sort').value;

    if (q) list = list.filter(x => x.ticker.includes(q));
    if (!isNaN(minP)) list = list.filter(x => x.close >= minP);
    if (!isNaN(maxP)) list = list.filter(x => x.close <= maxP);
    if (!isNaN(minTx)) list = list.filter(x => (x.tx_miliar || 0) >= minTx);

    if (fCrt === 'BULL_ALL') list = list.filter(x => x.crt_bull);
    else if (fCrt === 'CONFIRMED') list = list.filter(x => x.crt_bull && x.crt_status === 'CONFIRMED');
    else if (fCrt === 'POTENTIAL') list = list.filter(x => x.crt_bull && x.crt_status === 'POTENTIAL');

    if (fMa === 'ABOVE_20') list = list.filter(x => x.above_ma20);
    else if (fMa === 'ABOVE_50') list = list.filter(x => x.above_ma50);
    else if (fMa === 'ABOVE_BOTH') list = list.filter(x => x.above_ma20 && x.above_ma50);
    else if (fMa === 'NEAR_MA20') list = list.filter(x => Math.abs(x.dist_ma20 || 99) <= 2.0);
    else if (fMa === 'BELOW_20') list = list.filter(x => x.ma20 > 0 && x.close < x.ma20);

    if (fSt === 'OS_CROSS') list = list.filter(x => x.stoch_os_cross);
    else if (fSt === 'OS_ZONE') list = list.filter(x => x.stoch_k <= 20);
    else if (fSt === 'OB_ZONE') list = list.filter(x => x.stoch_k >= 80);

    if (fRsi === 'OS') list = list.filter(x => (x.rsi14 || 50) <= 30);
    else if (fRsi === 'MID') list = list.filter(x => (x.rsi14 || 50) >= 40 && (x.rsi14 || 50) <= 60);
    else if (fRsi === 'OB') list = list.filter(x => (x.rsi14 || 50) >= 70);

    if (fSort === 'TICKER_ASC') list.sort((a, b) => a.ticker.localeCompare(b.ticker));
    else if (fSort === 'TX_DESC') list.sort((a, b) => (b.tx_miliar || 0) - (a.tx_miliar || 0));
    else if (fSort === 'PRICE_ASC') list.sort((a, b) => a.close - b.close);
    else if (fSort === 'PRICE_DESC') list.sort((a, b) => b.close - a.close);
    else if (fSort === 'CHG_DESC') list.sort((a, b) => b.change_pct - a.change_pct);
    else if (fSort === 'STOCH_ASC') list.sort((a, b) => a.stoch_k - b.stoch_k);

    document.getElementById('count-filtered').textContent = list.length;
    document.getElementById('top-scr-count').textContent = list.length;
  }

  // Update filtered counter even when viewing "Semua Saham"
  if (activeScreenerTab === 'all') {
    document.getElementById('count-filtered').textContent = rawAll.length;
  }

  const hdr = document.getElementById('table-header-row');
  if (isScreenerFullscreen) {
    hdr.innerHTML = `
      <div class="col-span-2">Ticker</div>
      <div class="col-span-2 text-right">Last Price</div>
      <div class="col-span-1 text-right">%Chg</div>
      <div class="col-span-1 text-right">Tx (M)</div>
      <div class="col-span-1 text-right">MA20</div>
      <div class="col-span-1 text-right">MA50</div>
      <div class="col-span-1 text-right">RSI14</div>
      <div class="col-span-1 text-right">Stoch K/D</div>
      <div class="col-span-2 text-right">CRT Signal</div>
    `;
  } else {
    hdr.innerHTML = `
      <div class="col-span-5">Ticker / Status</div>
      <div class="col-span-3 text-right">Price / Chg</div>
      <div class="col-span-2 text-right">Tx (M)</div>
      <div class="col-span-2 text-right">Stoch</div>
    `;
  }

  const container = document.getElementById('stock-list');
  if (!list.length) {
    container.innerHTML = `<div class="p-8 text-center text-xs t-text-muted">Tidak ada emiten yang cocok dengan filter.</div>`;
    return;
  }

  container.innerHTML = list.map(item => {
    const sel = item.ticker === currentTicker;
    const chgCol = item.change_pct >= 0 ? 'var(--bull)' : 'var(--bear)';
    const sign = item.change_pct > 0 ? '+' : '';
    const pill = item.crt_status === 'POTENTIAL'
      ? `<span class="text-[9px] font-bold px-1.5 py-0.2 rounded-xs" style="background:rgba(255,171,0,0.2);color:#ffab00">POTENTIAL</span>`
      : (item.crt_status === 'CONFIRMED'
        ? `<span class="text-[9px] font-bold px-1.5 py-0.2 rounded-xs" style="background:rgba(0,200,83,0.2);color:var(--bull)">CONFIRMED</span>`
        : '');

    const onSelectRow = `currentTicker='${item.ticker}'; if(isScreenerFullscreen){isScreenerFullscreen=false;applyScreenerLayout();} selectTimeframe('${screenerTF}'); renderStockList();`;

    if (isScreenerFullscreen) {
      return `
      <div onclick="${onSelectRow}" class="grid grid-cols-12 items-center px-3 py-2 cursor-pointer t-row text-xs tabular-nums ${sel ? 't-row-active' : ''}">
        <div class="col-span-2 font-bold t-accent-text flex items-center space-x-2"><span>${item.ticker}</span>${pill}</div>
        <div class="col-span-2 text-right font-bold t-text-main">${item.close.toLocaleString('id-ID')}</div>
        <div class="col-span-1 text-right font-semibold" style="color:${chgCol}">${sign}${item.change_pct}%</div>
        <div class="col-span-1 text-right t-text-muted">${(item.tx_miliar || 0).toFixed(1)}B</div>
        <div class="col-span-1 text-right t-text-main">${item.ma20 ? item.ma20.toLocaleString('id-ID') : '-'}</div>
        <div class="col-span-1 text-right t-text-main">${item.ma50 ? item.ma50.toLocaleString('id-ID') : '-'}</div>
        <div class="col-span-1 text-right t-text-main">${item.rsi14 ?? '-'}</div>
        <div class="col-span-1 text-right t-text-muted">${item.stoch_k}/${item.stoch_d}</div>
        <div class="col-span-2 text-right text-[11px] t-text-main">${item.crt_sig || '-'}</div>
      </div>`;
    }

    return `
    <div onclick="${onSelectRow}" class="grid grid-cols-12 items-center px-3 py-2 cursor-pointer t-row ${sel ? 't-row-active' : ''}">
      <div class="col-span-5">
        <div class="font-bold text-xs t-accent-text flex items-center space-x-1.5"><span>${item.ticker}</span>${pill}</div>
        <div class="text-[10px] t-text-muted truncate">${item.crt_sig || screenerTF.toUpperCase()}</div>
      </div>
      <div class="col-span-3 text-right tabular-nums">
        <div class="text-xs font-bold t-text-main">${item.close.toLocaleString('id-ID')}</div>
        <div class="text-[10px] font-semibold" style="color:${chgCol}">${sign}${item.change_pct}%</div>
      </div>
      <div class="col-span-2 text-right text-[10px] t-text-muted tabular-nums">${(item.tx_miliar || 0).toFixed(1)}B</div>
      <div class="col-span-2 text-right text-[10px] tabular-nums">
        <div class="t-text-main">${item.stoch_k}</div>
        <div class="t-text-muted">${item.stoch_d}</div>
      </div>
    </div>`;
  }).join('');
}

// ==========================================
// 7. KEYBOARD SHORTCUTS & INIT
// ==========================================
document.getElementById('top-ticker-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const v = e.target.value.trim().toUpperCase();
    if (v.length >= 4) { currentTicker = v; selectTimeframe(activeChartTF); }
  }
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') {
    setDrawTool('cursor');
    deselectDrawing();
  } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedDrawId) {
    deleteSelectedDrawing();
  }
});

async function initApp() {
  initCharts();
  try {
    const res = await fetch('data/screener_idx.json?t=' + Date.now());
    screenerData = await res.json();
    document.getElementById('last-updated').textContent = `Update: ${screenerData.last_updated}`;
    renderStockList();
    loadHTFChart('BBCA', '1d');
  } catch (err) { console.error(err); }
}
initApp();
</script>
