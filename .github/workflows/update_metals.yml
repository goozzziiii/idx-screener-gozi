name: Update Metals & Divergence Feed (XAU/XAUEUR/XAG)

on:
  schedule:
    # Jalan otomatis setiap 15 menit pada hari Senin - Jumat
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dukascopy-python yfinance pandas numpy

      - name: Run Metals Feed
        run: python metals_feed.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/metals_divergence.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update metals divergence data" && git push)
