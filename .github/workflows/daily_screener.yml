name: Update Harian IDX Screener

on:
  schedule:
    # Pukul 09:30 UTC = Pukul 16:30 WIB (Senin - Jumat setelah bursa tutup)
    - cron: '30 9 * * 1-5'
  # Tombol manual supaya bisa dites kapan saja dari web GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode terbaru dari repository
        uses: actions/checkout@v4

      - name: Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install library Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan IDX Screener (839+ Saham)
        run: python screener.py

      - name: Simpan dan Publish hasil JSON terbaru
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data IDX $(date +'%Y-%m-%d')" && git push)
